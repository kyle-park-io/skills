# Harvested from jarvis (pnpm-workspace.yaml). `allowBuilds` is the point. `packages` is what any
# pnpm workspace starts with and carries no comment.
#
# Read this piece's README.md before copying. The two entries below are jarvis's dependencies,
# not yours -- the field is what transfers, not its contents.

packages:
  - "packages/*"
  - "apps/*"

# pnpm 11 does not run a dependency's install scripts unless the dependency is listed here. For a
# package with a native addon that means the bindings are never compiled -- and NOTHING FAILS AT
# INSTALL TIME. `pnpm install` prints an "ignored build scripts" note and succeeds. The break
# surfaces later, wherever something first imports the module and the compiled .node file is not
# there. In CI, where install is the first step and the import happens during tests, it reads as a
# test failure in an unrelated-looking file.
#
# jarvis hit this on 2026-07-14 while scaffolding @jarvis/store around better-sqlite3. The plan
# that fixed it is docs/plans/2026-07-14-store-persistence.md, Steps 3-5: it pairs this allowlist
# entry with a test that opens an in-memory database, so that a build which did not run fails
# loudly, in a named place, instead of somewhere downstream. That test is not part of this piece --
# see the README's "바꿔야 할 것".
#
# Produce entries with `pnpm approve-builds`, not by hand: it lists what the current lockfile
# actually wants to build. esbuild is in this list because that command surfaced it.
allowBuilds:
  better-sqlite3: true
  esbuild: true
