# Harvested from mantle-kr-herald (.github/workflows/ci.yml). Two steps here are the point:
# "Check the PR title" and "Type-check (web)". Everything else is the scaffolding needed to run
# them, and carries no comment because it is what any pnpm project starts with.
#
# Read this piece's README.md before keeping either of those two steps. Both have conditions.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Where a repo squash-merges, the pull request title becomes the commit subject on main. That
      # makes the title the one piece of text nothing checks. In mantle-kr-herald, on 2026-08-11,
      # two Korean subjects landed through it against four hundred English ones -- every commit on
      # those branches was English; only the titles were not.
      #
      # Checked here, INSIDE the `test` job, rather than as a job of its own: `test` was the single
      # required status check on main, so a new job would not have been enforced until someone
      # remembered to add it to the required list. Check your own branch protection before moving
      # this out.
      #
      # The title goes through the environment, never interpolated into a shell command -- a title
      # containing a backtick or `$(...)` would otherwise run on the runner. Keep it that way.
      #
      # Needs a `check:pr-title` script in package.json reading process.env.PR_TITLE. It is not
      # part of this piece; write the rule your repo actually wants.
      - name: Check the PR title makes a usable commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm check:pr-title

      - name: Type-check
        run: pnpm typecheck

      # A subdirectory with its own tsconfig is not covered by the root typecheck, and Vitest runs
      # through esbuild, which strips types rather than checking them. Where those two overlap, a
      # type error in that subdirectory passes every gate and lands on main. In mantle-kr-herald
      # that subdirectory was web/; the error that exposed it sat in web/tests/OutletCard.test.tsx.
      #
      # Add one step per extra tsconfig. Drop this step if the repo has exactly one.
      - name: Type-check (web)
        run: pnpm typecheck:web

      - name: Test
        run: pnpm test
